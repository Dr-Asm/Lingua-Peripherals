plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.76'
}

version = '1.3.2'
group = 'com.linguaperipherals'

base {
    archivesName = 'linguaperipherals'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = '21.1.228'
    runs {
        client {
            client()
        }
        server {
            server()
        }
    }
    mods {
        linguaperipherals {
            sourceSet sourceSets.main
        }
    }
}

repositories {
    flatDir { dirs 'libs' }
}

dependencies {
    // Mandatory: CC:Tweaked
    implementation fileTree(dir: 'libs', include: ['cc-tweaked-*.jar'])
    // Compile-only: Create + its transitive deps + JEI (for subtype plugin)
    compileOnly fileTree(dir: 'libs', include: ['create-*.jar', 'Registrate-*.jar', 'ponder-*.jar', 'jei-*.jar'])
    // Other runClient mods
    runtimeOnly fileTree(dir: 'libs', exclude: ['cc-tweaked-*.jar', 'create-*.jar', 'Registrate-*.jar', 'ponder-*.jar'])
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
            'Specification-Title'   : 'Lingua Peripherals',
            'Specification-Vendor'  : 'linguaperipherals',
            'Specification-Version' : '1',
            'Implementation-Title'  : 'Lingua Peripherals',
            'Implementation-Version': project.version,
            'Implementation-Vendor' : 'linguaperipherals',
        ])
    }
}