plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.76'
}

version = '1.0.0'
group = 'com.linguaperipherals'

base {
    archivesName = 'linguaperipherals'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = '21.1.228'
    runs {
        client {
            client()
        }
        server {
            server()
        }
    }
    mods {
        linguaperipherals {
            sourceSet sourceSets.main
        }
    }
}

repositories {
    flatDir {
        dirs 'libs'
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
            'Specification-Title'   : 'Lingua Peripherals',
            'Specification-Vendor'  : 'linguaperipherals',
            'Specification-Version' : '1',
            'Implementation-Title'  : 'Lingua Peripherals',
            'Implementation-Version': project.version,
            'Implementation-Vendor' : 'linguaperipherals',
        ])
    }
}