plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}

version = '2.0.0'
group = 'com.linguaperipherals'

base { archivesName = 'linguaperipherals-1.20.1-forge' }

java { sourceCompatibility = targetCompatibility = '17' }

minecraft {
    mappings channel: 'official', version: '1.20.1'
    accessTransformer = file('src/main/resources/META-INF/accesstransformer.cfg')
    runs {
        client {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            mods { linguaperipherals { source sourceSets.main } }
        }
        server {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            mods { linguaperipherals { source sourceSets.main } }
        }
    }
}

repositories {
    flatDir { dirs 'libs' }
    maven { url "https://api.modrinth.com/maven"; content { includeGroup "maven.modrinth" } }
}

dependencies {
    minecraft 'net.minecraftforge:forge:1.20.1-47.4.22'
    implementation fg.deobf("maven.modrinth:cc-tweaked:1.120.0")
    compileOnly "maven.modrinth:create:1.20.1-0.5.1.j"
}

tasks.named('jar', Jar).configure {
    manifest { attributes([
        'Specification-Title': 'Lingua Peripherals',
        'Specification-Vendor': 'linguaperipherals',
        'Specification-Version': '1',
        'Implementation-Title': 'Lingua Peripherals',
        'Implementation-Version': project.version,
        'Implementation-Vendor': 'linguaperipherals'
    ])}
}

tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
